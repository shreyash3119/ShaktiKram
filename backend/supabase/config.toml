# Supabase local/project configuration (Stage 1). Verify against your installed CLI version with `supabase start`.
project_id = "personal-fitness-system"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600                      # short-lived access token; the session persists through refresh tokens
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false                  # decision D3: the single owner account is created once by hand
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.media]
public = false
file_size_limit = "50MiB"

[storage.buckets.backups]
public = false
