name: shaktikram
description: ShaktiKram personal fitness management app (Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.7.0

# Version numbers are minimum floors: run `flutter pub upgrade` for the newest compatible ones.
# Later steps add: local_auth, flutter_local_notifications.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  supabase_flutter: ^2.15.4
  shared_preferences: ^2.3.0
  sqflite: ^2.4.1
  path: ^1.9.0
  # Stage 5 (reports and backup): HTTP to the reporting service, app storage, sharing a saved file, choosing a backup file.
  http: ^1.2.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # App icon and launch screen, generated from assets/branding/shaktikram_logo.png (see assets/branding/README.md).
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Run after adding the logo:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/shaktikram_logo.png"
  adaptive_icon_background: "#0B111D"
  adaptive_icon_foreground: "assets/branding/shaktikram_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0B111D"
  image: "assets/branding/shaktikram_logo.png"
  android: true
  ios: false
  android_12:
    color: "#0B111D"
    image: "assets/branding/shaktikram_logo.png"
